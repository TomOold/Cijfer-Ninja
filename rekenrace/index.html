RR.UI = (function () {
  'use strict';

  // ---------- constants ----------
  const SIZE = RR.Sprites.SIZES;
  const TRACKS = RR.Tracks;
  const HEROES = RR.Heroes;
  const SUMS_PER_RACE = 10;
  const SCENE_MAX_W = 960;          // 3 x the logical scene width
  const SCENE_RATIO = 20 / 9;
  const GARAGE_RIGHT_MIN = 260;     // the garage buttons need at least this much room
  const REDUCED_PAUSE_MS = 600;     // reduced motion: no glide, so give the feedback a moment to be read
  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
  const MONTHS = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
  const FOCUS_ORDER = ['mix', 'add', 'sub', 'times', 'div', 'story'];

  // ---------- state: one object ----------
  const S = {
    store: null,
    scene: null,
    canvas: null,
    frame: null,
    slot: null,
    screen: null,
    wide: false,
    short: false,
    reduced: false,
    races: 0,                 // finished races this sitting (never stored)
    raceSeq: 0,
    race: null,               // the race in progress
    finish: null,             // result of the last race, for the finish screen
    free: { track: 1, focus: 'mix', table: 0 },
    parentsFrom: 'menu',
    confirm: null,            // { kind: 'reset' | 'remove', id } while a parent confirms
    notice: '',
    fitQueued: false
  };

  // ---------- small DOM helpers ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const byId = id => document.getElementById(id);

  // h('button', { class: 'btn', type: 'button' }, ['text', childNode]): strings become text nodes.
  function h(tag, props, kids) {
    const el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(k => {
        const v = props[k];
        if (v === undefined || v === null || v === false) return;
        el.setAttribute(k, v === true ? '' : String(v));
      });
    }
    append(el, kids);
    return el;
  }

  function append(el, kids) {
    if (kids === undefined || kids === null || kids === false) return;
    if (Array.isArray(kids)) { kids.forEach(k => append(el, k)); return; }
    el.appendChild(typeof kids === 'object' ? kids : document.createTextNode(String(kids)));
  }

  function svg(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }

  function txt(path) {
    return path.split('.').reduce((o, k) => (o === undefined || o === null ? o : o[k]), TXT);
  }

  // Pixel-art images from RR.Sprites, always at a whole-number scale.
  function pic(url, w, h2, cls) {
    return h('img', { src: url, alt: '', width: w, height: h2, class: 'pix' + (cls ? ' ' + cls : ''), draggable: 'false' });
  }
  const headImg = (hero, scale, cls) => pic(RR.Sprites.headURL(hero, scale), SIZE.head.w * scale, SIZE.head.h * scale, cls);
  const kartImg = (hero, scale, cls) => pic(RR.Sprites.heroURL(hero, scale), SIZE.kart.w * scale, SIZE.kart.h * scale, cls);
  const iconImg = (name, scale, cls) => pic(RR.Sprites.iconURL(name, scale), SIZE.icon.w * scale, SIZE.icon.h * scale, cls);

  function longDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '';
    const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    try {
      const s = new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, mo - 1, d));
      if (s) return s;
    } catch (e) { /* fall through to the plain version */ }
    return d + ' ' + (MONTHS[mo - 1] || '') + ' ' + y;
  }

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  // "24 + ? = 51" with its answer filled in; stories get the answer after the text.
  function fullSum(q) {
    const text = q.text;
    if (q.kind !== 'story' && text.indexOf('\n') < 0 && text.split('?').length === 2) {
      return text.replace('?', String(q.answer));
    }
    return text.replace(/\n/g, ' ') + ' ' + String(q.answer);
  }

  function cur() { return S.store.current(); }

  // A new sitting: whoever sits down starts with a fresh race counter and the default free-race choices.
  function newSitting() {
    S.races = 0;
    S.free = { track: 1, focus: 'mix', table: 0 };
  }

  // ---------- announcements and focus ----------
  function announce(text) {
    const live = byId('announce');
    live.textContent = '';
    setTimeout(() => { live.textContent = text; }, 40);
  }

  function visibleHeading(sec) {
    const all = $$('.screen-title', sec);
    for (let i = 0; i < all.length; i++) if (all[i].offsetParent !== null) return all[i];
    return all[0] || null;
  }

  function focusHeading(id) {
    const sec = byId('s-' + id);
    const hd = visibleHeading(sec);
    if (!hd) return;
    sec.setAttribute('aria-labelledby', hd.id);
    hd.focus({ preventScroll: true });
    announce(hd.textContent);
    sec.scrollTop = 0;
  }

  function screenTitle(id, text, cls) {
    return h('h1', { class: 'screen-title' + (cls ? ' ' + cls : ''), id: 'h-' + id, tabindex: '-1' }, text);
  }

  function note(text, cls) { return h('p', { class: 'note ' + (cls || '') }, text); }

  function storageNote() {
    return S.store.status().persistent ? null : note(TXT.noStorage, 'quiet-note');
  }

  // ---------- navigation ----------
  const SCREENS = {};

  function show(id) {
    if (id === 'spelers' && !S.store.players().length) id = 'nieuw';
    if (needsPlayer(id) && !cur()) id = S.store.players().length ? 'spelers' : 'nieuw';
    const prev = S.screen;
    closePause();
    if (prev === 'race' && id !== 'race') S.race = null;
    if (prev && (prev === 'menu' || prev === 'race')) S.scene.setIdle(false);
    if (prev && prev !== 'race' && prev !== id) {     // no stale names in hidden screens
      byId('s-' + prev).replaceChildren();
      byId('s-' + prev).removeAttribute('aria-labelledby');
    }
    S.screen = id;
    $$('.screen').forEach(sec => { sec.hidden = sec.id !== 's-' + id; });
    byId('window').dataset.screen = id;
    SCREENS[id](byId('s-' + id));
    updateNav();
    focusHeading(id);
    queueFit();
  }

  function needsPlayer(id) {
    return ['menu', 'banen', 'vrij', 'race', 'finish', 'rust', 'tot-ziens', 'stempels', 'rijbewijs'].indexOf(id) >= 0;
  }

  function currentNav() {
    const back = TXT.header.back, menu = TXT.header.menu;
    switch (S.screen) {
      case 'nieuw': return S.store.players().length ? { label: back, to: 'spelers' } : null;
      case 'banen': case 'vrij': case 'stempels': return { label: menu, to: 'menu' };
      case 'rijbewijs': return { label: back, to: 'stempels' };
      case 'ouders': return S.parentsFrom === 'spelers' ? { label: back, to: 'spelers' } : { label: menu, to: 'menu' };
      case 'race': return S.race && S.race.phase === 'intro' ? { label: back, to: S.race.from } : null;
      default: return null;
    }
  }

  function updateNav() {
    const btn = byId('btn-nav');
    const nav = currentNav();
    btn.hidden = !nav;
    if (nav) btn.textContent = nav.label;
  }

  // ---------- settings (sound, music, rest moment) ----------
  function applySettings() {
    const st = S.store.settings();
    RR.Sound.configure({ sound: st.sound, music: st.music });
    $$('[data-action="toggle-setting"]').forEach(b => b.setAttribute('aria-pressed', String(!!st[b.dataset.setting])));
    $$('input[data-change="setting"]').forEach(i => { i.checked = !!st[i.dataset.setting]; });
  }

  function changeSetting(name, value) {
    S.store.setSetting(name, value);
    applySettings();
  }

  // ---------- the scene: one canvas, moved between screens ----------
  function sceneSizes() {
    const cs = getComputedStyle(S.frame);
    return {
      bw: (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0),
      bh: (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0)
    };
  }

  // Whole multiples of 320 device pixels are crispest; fall back to filling the space
  // when that multiple would leave too much of it empty (minFill is the share we insist on).
  function chooseWidth(maxW, minFill) {
    const dpr = window.devicePixelRatio || 1;
    const n = Math.floor(maxW * dpr / 320 + 1e-6);
    const whole = n >= 1 ? 320 * n / dpr : 0;
    return whole > 0 && whole >= maxW * minFill ? whole : Math.max(160, Math.floor(maxW));
  }

  function fitScene() {
    S.fitQueued = false;
    const slot = S.slot;
    if (!slot || !S.frame.isConnected || slot.offsetParent === null) return;
    const sz = sceneSizes();
    const left = slot.closest('.race-left');
    // measure the slot in its flexible state, then pin it to the size of the picture
    slot.style.height = '';
    if (left) left.style.flex = '';
    let w;
    if (S.screen === 'race' && S.wide) {
      const body = byId('race-body');
      const cs = getComputedStyle(body);
      const gap = parseFloat(cs.columnGap) || 24;
      const rightMin = parseFloat(cs.getPropertyValue('--right-min')) || 272;
      const line = byId('race-line');
      const lineH = Math.max(48, line.offsetParent !== null ? line.offsetHeight : 0) + (parseFloat(getComputedStyle(line.parentElement).rowGap) || 0);   // the start card hides the line; keep the size steady
      const maxW = Math.min(body.clientWidth - gap - rightMin - sz.bw, (body.clientHeight - lineH - sz.bh) * SCENE_RATIO);
      w = chooseWidth(Math.min(maxW, SCENE_MAX_W), 0.8);
      body.style.setProperty('--scene-col', (w + sz.bw) + 'px');
    } else {
      byId('race-body').style.removeProperty('--scene-col');
      const lay = slot.closest('.menu-layout');
      let maxW = slot.clientWidth - sz.bw;
      if (lay && S.wide) {
        // garage, two columns: the left column is exactly as wide as the picture
        const lcs = getComputedStyle(lay);
        maxW = lay.clientWidth - (parseFloat(lcs.columnGap) || 28) - GARAGE_RIGHT_MIN - sz.bw;
      }
      if (slot.dataset.fit === 'width' && S.wide && S.short) maxW = Math.min(maxW, 320);   // keep the garage on one screen
      if (slot.dataset.fit === 'both') maxW = Math.min(maxW, (slot.clientHeight - sz.bh) * SCENE_RATIO);
      w = chooseWidth(Math.min(maxW, SCENE_MAX_W), slot.dataset.fit === 'width' ? 0 : 0.8);
      if (lay) { if (S.wide) lay.style.setProperty('--left-w', (w + sz.bw) + 'px'); else lay.style.removeProperty('--left-w'); }
      slot.style.height = (w / SCENE_RATIO + sz.bh) + 'px';
      if (left) left.style.flex = 'none';
    }
    S.canvas.style.width = w + 'px';
    S.scene.resize();
  }

  function queueFit() {
    if (S.fitQueued) return;
    S.fitQueued = true;
    requestAnimationFrame(fitScene);
  }

  function bindScene(slot) {
    S.slot = slot;
    slot.appendChild(S.frame);
  }

  function applyLayoutClasses() {
    const w = window.innerWidth, hgt = window.innerHeight;
    S.wide = w >= 640 && w / hgt >= 1.1;
    S.short = hgt <= 520;
    const root = document.documentElement;
    root.classList.toggle('is-wide', S.wide);
    root.classList.toggle('is-short', S.short);
  }

  function setSceneLabel(label) { S.canvas.setAttribute('aria-label', label); }

  function placeWord(state) {
    const me = RR.Race.standings(state).filter(r => r.isPlayer)[0];
    return TXT.race.places[me.place - 1];
  }

  // ---------- screen: player chooser ----------
  SCREENS.spelers = function (sec) {
    const players = S.store.players();
    const cards = players.map(p => h('button', { type: 'button', class: 'pcard', 'data-action': 'pick-player', 'data-id': p.id }, [
      headImg(p.hero, 5, 'pcard-head'),
      h('span', { class: 'pcard-name' }, p.name),
      h('span', { class: 'pcard-sub' }, TXT.spelers.group(p.grade))
    ]));
    if (players.length < RR.Store.LIMITS.players) {
      cards.push(h('button', { type: 'button', class: 'pcard pcard-new', 'data-action': 'new-player' }, [
        h('span', { class: 'plus', 'aria-hidden': 'true' }, '+'),
        h('span', { class: 'pcard-name' }, TXT.spelers.newPlayer)
      ]));
    }
    sec.replaceChildren(
      h('div', { class: 'page' }, [
        screenTitle('spelers', TXT.spelers.title),
        h('div', { class: 'pgrid' }, cards),
        storageNote(),
        h('p', { class: 'foot' }, h('button', { type: 'button', class: 'btn quiet', 'data-action': 'parents' }, TXT.spelers.parents))
      ])
    );
  };

  // ---------- screen: new player ----------
  SCREENS.nieuw = function (sec) {
    const L = RR.Store.LIMITS;
    const heroes = HEROES.map(hero => h('div', { class: 'hero-card' }, [
      h('input', { type: 'radio', name: 'hero', id: 'hero-' + hero.id, value: hero.id, class: 'vh', 'aria-labelledby': 'hn-' + hero.id, 'aria-describedby': 'ht-' + hero.id }),
      h('label', { for: 'hero-' + hero.id }, [
        kartImg(hero.id, 3, 'hero-pic'),
        h('span', { class: 'hero-name', id: 'hn-' + hero.id }, hero.name),
        h('span', { class: 'hero-tag', id: 'ht-' + hero.id }, hero.tagline)
      ])
    ]));
    const grades = [3, 4, 5, 6].map(g => h('div', { class: 'chip' }, [
      h('input', { type: 'radio', name: 'grade', id: 'grade-' + g, value: g, class: 'vh', checked: g === 4 }),
      h('label', { for: 'grade-' + g }, TXT.spelers.group(g))
    ]));
    const form = h('form', { class: 'form', id: 'form-new', novalidate: true, 'data-form': 'new-player' }, [
      h('div', { class: 'field' }, [
        h('label', { for: 'in-name', class: 'label' }, TXT.nieuw.name),
        h('input', { type: 'text', id: 'in-name', name: 'name', class: 'text-in', maxlength: L.nameLength, autocomplete: 'off', autocapitalize: 'words', spellcheck: 'false', 'aria-describedby': 'hint-name err-name' }),
        h('p', { class: 'hint', id: 'hint-name' }, TXT.nieuw.nameHint),
        h('p', { class: 'field-error', id: 'err-name', role: 'alert', hidden: true })
      ]),
      h('fieldset', { class: 'fieldset' }, [
        h('legend', { class: 'label' }, TXT.nieuw.hero),
        h('div', { class: 'hero-grid' }, heroes),
        h('p', { class: 'field-error', id: 'err-hero', role: 'alert', hidden: true })
      ]),
      h('fieldset', { class: 'fieldset' }, [
        h('legend', { class: 'label' }, TXT.nieuw.grade),
        h('div', { class: 'chips' }, grades),
        h('p', { class: 'field-error', id: 'err-grade', role: 'alert', hidden: true })
      ]),
      h('div', { class: 'form-actions' }, h('button', { type: 'submit', class: 'btn primary big', 'data-sfx': '' }, TXT.nieuw.submit))
    ]);
    sec.replaceChildren(h('div', { class: 'page page-form' }, [screenTitle('nieuw', TXT.nieuw.title), form, storageNote()]));
  };

  function setFieldError(field, message) {
    const el = byId('err-' + field);
    el.textContent = message || '';
    el.hidden = !message;
    if (field === 'name') byId('in-name').setAttribute('aria-invalid', message ? 'true' : 'false');
  }

  function submitNewPlayer(form) {
    const name = form.elements.name.value;
    const heroEl = form.querySelector('input[name="hero"]:checked');
    const gradeEl = form.querySelector('input[name="grade"]:checked');
    const E = TXT.nieuw.errors;
    ['name', 'hero', 'grade'].forEach(f => setFieldError(f, ''));
    let firstBad = null;
    if (!name.trim()) { setFieldError('name', E.name_empty); firstBad = firstBad || byId('in-name'); }
    if (!heroEl) { setFieldError('hero', E.bad_hero); firstBad = firstBad || form.querySelector('input[name="hero"]'); }
    if (!gradeEl) { setFieldError('grade', E.bad_grade); firstBad = firstBad || form.querySelector('input[name="grade"]'); }
    if (firstBad) { firstBad.focus(); return; }

  function enterRace(cfg) {
    const player = cur();
    const track = TRACKS[cfg.trackId - 1];
    const seed = Math.floor(RR.Rng.random()() * 4294967296);
    const state = RR.Race.create({ track: track, hero: player.hero, seed: seed });
    S.race = {
      id: ++S.raceSeq, cfg: cfg, track: track, mode: cfg.mode, from: cfg.from, state: state,
      questions: [], q: null, index: 0, attempt: 0, input: '', phase: 'intro', log: []
    };
    show('race');
  }

  const alive = R => S.race === R;

  function setPhase(R, phase) {
    R.phase = phase;
    const sec = byId('s-race');
    sec.dataset.phase = phase;
    sec.setAttribute('aria-labelledby', phase === 'intro' ? 'intro-title' : 'race-title');
    updateNav();
    queueFit();     // the right column changes height between the start card and the sum
  }

  SCREENS.race = function () {
    const R = S.race;
    const tr = R.track;
    byId('race-title').textContent = R.mode === 'free' ? TXT.race.freeTitle(tr) : TXT.race.title(tr);
    byId('intro-title').textContent = TXT.race.title(tr);
    byId('intro-blurb').textContent = tr.blurb;
    const extra = byId('intro-extra');
    extra.textContent = R.mode === 'free' ? TXT.race.freeNote + ' ' + TXT.race.freeFocus(TXT.vrij.focusLine(R.cfg.focus, R.cfg.table)) : '';
    extra.hidden = R.mode !== 'free';
    byId('race-progress').textContent = '';
    byId('feedback').textContent = '';
    byId('feedback').dataset.tone = '';
    byId('q').textContent = '';
    byId('answer-text').textContent = '';
    bindScene(byId('slot-race'));
    S.scene.setTrack(tr.theme, tr.length);
    S.scene.setRacers(RR.Race.racers(R.state), R.state.hero.id);
    S.scene.place(RR.Race.positions(R.state));
    setSceneLabel(TXT.race.sceneLabelStart(tr));
    S.scene.setIdle(true);
    setPhase(R, 'intro');
  };

  function startRace() {
    const R = S.race;
    if (!R || R.phase !== 'intro') return;
    const player = cur();
    const opts = { grade: player.grade, level: R.track.id, focus: R.cfg.focus, repeat: S.store.openKeys(3) };
    if (R.cfg.table) opts.table = R.cfg.table;
    R.questions = RR.Questions.series(opts, SUMS_PER_RACE);
    R.index = 0;
    RR.Sound.play('go');
    showQuestion(R);
  }

  function renderLines(el, text) {
    el.replaceChildren();
    String(text).split('\n').forEach((line, i) => {
      if (i) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(line));
    });
  }

  function showQuestion(R) {
    const q = R.questions[R.index];
    R.q = q;
    R.attempt = 0;
    R.input = '';
    const qEl = byId('q');
    renderLines(qEl, q.text);
    qEl.className = 'q' + (q.text.indexOf('\n') >= 0 ? ' q-story' : q.text.length > 14 ? ' q-long' : '');
    setPhase(R, 'ask');
    byId('race-progress').textContent = TXT.race.progress(R.index + 1, R.questions.length);
    setFeedback('', '');
    renderAnswer(R);
    qEl.focus({ preventScroll: true });
  }

  function renderAnswer(R) {
    byId('answer-text').textContent = R.input;
    byId('answer').dataset.empty = R.input ? 'false' : 'true';
  }

  function setFeedback(main, extra, tone) {
    const fb = byId('feedback');
    fb.replaceChildren();
    fb.dataset.tone = main || extra ? (tone || 'ok') : '';
    if (!main && !extra) return;
    fb.appendChild(h('span', { class: 'fb' }, [main ? h('span', { class: 'fb-main' }, main) : null, extra ? ' ' + extra : null]));
  }

  function pressDigit(d) {
    const R = S.race;
    if (!R || R.phase !== 'ask' || R.input.length >= 5) return;
    R.input += d;
    RR.Sound.play('key');
    renderAnswer(R);
  }

  function pressDel() {
    const R = S.race;
    if (!R || R.phase !== 'ask' || !R.input) return;
    R.input = R.input.slice(0, -1);
    RR.Sound.play('del');
    renderAnswer(R);
  }

  function submitAnswer() {
    const R = S.race;
    if (!R || R.phase !== 'ask' || !R.input) return;
    const q = R.q;
    R.attempt++;
    if (RR.Questions.check(q, R.input)) {
      const outcome = R.attempt === 1 ? 'first' : 'second';
      RR.Sound.play('ok');
      setFeedback(outcome === 'first' ? TXT.race.ok[R.index % TXT.race.ok.length] : TXT.race.second, '', 'ok');
      resolveSum(R, outcome);
    } else if (R.attempt === 1) {
      RR.Sound.play('almost');
      setFeedback(TXT.race.notYet, q.hint, 'note');
      R.input = '';
      renderAnswer(R);
    } else {
      RR.Sound.play('almost');
      showExplain(R);
    }
  }

  function showExplain(R) {
    const q = R.q;
    byId('explain-answer').textContent = TXT.race.answerIs(q.answer);
    renderExplain(byId('explain-text'), q.explain);
    setFeedback('', '');
    R.input = '';
    renderAnswer(R);
    setPhase(R, 'explain');
    byId('btn-next').focus({ preventScroll: true });
  }

  function renderExplain(el, text) {
    el.replaceChildren();
    String(text).split('\n').forEach(line => el.appendChild(h('p', null, line)));
  }

  function nextAfterExplain() {
    const R = S.race;
    if (!R || R.phase !== 'explain') return;
    resolveSum(R, 'miss');
  }

  // A glide cannot be held, but whatever comes after it waits while the pause dialog is open.
  function whenResumed() {
    const dlg = byId('dlg-pause');
    if (!dlg.open) return Promise.resolve();
    return new Promise(resolve => dlg.addEventListener('close', resolve, { once: true }));
  }

  async function glide(R, positions, opts) {
    await S.scene.advanceTo(positions, opts);
    if (S.reduced && alive(R)) await sleep(REDUCED_PAUSE_MS);
    await whenResumed();
  }

  async function resolveSum(R, outcome) {
    const q = R.q;
    setPhase(R, 'gliding');
    S.store.recordAnswer(q.key, q.kind, outcome);
    R.log.push({ q: q, outcome: outcome });
    const res = RR.Race.advance(R.state, outcome);
    RR.Sound.play('glide');
    await glide(R, RR.Race.positions(R.state), { boost: outcome === 'first' });
    if (!alive(R)) return;
    setSceneLabel(TXT.race.sceneLabel(R.track, placeWord(R.state)));
    if (!res.done) {
      R.index++;
      showQuestion(R);
      return;
    }
    setPhase(R, 'done');
    await glide(R, RR.Race.rollout(R.state));
    if (!alive(R)) return;
    finishRace(R);
  }

  function finishRace(R) {
    const sum = RR.Race.summary(R.state);
    let isNew = false;
    if (R.mode === 'championship') {
      isNew = !S.store.stamps()[R.track.id];
      S.store.stamp(R.track.id, sum.place);
    }
    S.races++;
    RR.Sound.play(isNew ? 'stamp' : 'finish');
    S.finish = {
      cfg: R.cfg, track: R.track, mode: R.mode, summary: sum,
      standings: RR.Race.standings(R.state), isNewStamp: isNew,
      missed: R.log.filter(e => e.outcome === 'miss').map(e => e.q).slice(0, 5)
    };
    show('finish');
  }

  function openPause() {
    const R = S.race;
    const dlg = byId('dlg-pause');
    if (!R || R.phase === 'intro' || dlg.open) return;
    applySettings();
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function closePause() {
    const dlg = byId('dlg-pause');
    if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
  }

  function stopRace() {
    closePause();
    S.race = null;
    show('menu');
  }

    const confirming = S.confirm && S.confirm.id === p.id;

      [3, 4, 5, 6].map(g => h('option', { value: g, selected: g === p.grade }, TXT.spelers.group(g))));

          h('button', { type: 'button', class: 'btn', id: 'btn-confirm-cancel', 'data-action': 'confirm-cancel' }, TXT.ouders.cancel)
        ])
      ]);

      ]);
    }
    return h('section', { class: 'panel pl-card', 'aria-labelledby': 'pl-' + p.id }, [
      h('div', { class: 'pl-head' }, [
        headImg(p.hero, 4, 'pl-head-img'),
        h('h2', { id: 'pl-' + p.id, class: 'pl-name' }, p.name),
        h('div', { class: 'pl-grade' }, [h('label', { for: 'grade-' + p.id }, TXT.ouders.grade), gradeSelect])
      ]),
      h('h3', null, TXT.ouders.results),
      kindBlock(p),
      h('p', { class: 'hint' }, TXT.ouders.kindNote),
      h('h3', null, TXT.ouders.tricky),
      trickyBlock(p),
      actions
    ]);
  }

  SCREENS.ouders = function (sec) {
    const st = S.store.settings();
    const restOpts = [h('option', { value: 0, selected: st.restAfter === 0 }, TXT.ouders.restOff)]
      .concat(Array.from({ length: RR.Store.LIMITS.restAfter }, (_, i) => h('option', { value: i + 1, selected: st.restAfter === i + 1 }, TXT.ouders.restN(i + 1))));
    const players = S.store.players();
    const notice = S.notice;
    S.notice = '';
    sec.replaceChildren(h('div', { class: 'page' }, [
      screenTitle('ouders', TXT.ouders.title),
      h('p', { class: 'lead' }, TXT.ouders.intro),
      notice ? h('p', { class: 'notice', role: 'status' }, notice) : null,
      players.length ? players.map(playerCard) : h('p', { class: 'hint' }, TXT.ouders.noPlayers),
      h('section', { class: 'panel settings', 'aria-labelledby': 'h-settings' }, [
        h('h2', { id: 'h-settings' }, TXT.ouders.settings),
        h('label', { class: 'check' }, [h('input', { type: 'checkbox', 'data-change': 'setting', 'data-setting': 'sound', checked: st.sound }), h('span', null, TXT.settings.sound)]),
        h('label', { class: 'check' }, [h('input', { type: 'checkbox', 'data-change': 'setting', 'data-setting': 'music', checked: st.music }), h('span', null, TXT.settings.music)]),
        h('div', { class: 'field-row' }, [h('label', { for: 'sel-rest' }, TXT.ouders.rest), h('select', { class: 'select', id: 'sel-rest', 'data-change': 'rest' }, restOpts)])
      ]),
      h('section', { class: 'about', 'aria-labelledby': 'h-about' }, [h('h2', { id: 'h-about' }, TXT.ouders.about), h('p', null, TXT.ouders.aboutText)])
    ]));
    if (S.confirm) { const c = byId('btn-confirm-cancel'); if (c) setTimeout(() => c.focus(), 0); }
  };

  function rerender(id) {
    SCREENS[id](byId('s-' + id));
    updateNav();
  }

  // ---------- actions (click delegation) ----------
  const ACTIONS = {
    'pick-player': el => { S.store.select(el.dataset.id); newSitting(); show('menu'); },
    'new-player': () => show('nieuw'),
    'other-player': () => { S.store.select(null); newSitting(); show('spelers'); },
    'to': el => show(el.dataset.to),
    'nav': () => { const n = currentNav(); if (n) show(n.to); },
    'parents': () => { S.parentsFrom = S.screen === 'spelers' ? 'spelers' : 'menu'; S.confirm = null; show('ouders'); },
    'play-track': el => {
      const id = Number(el.dataset.id);
      if (id <= S.store.nextTrack()) enterRace({ mode: 'championship', trackId: id, focus: 'mix', table: 0, from: 'banen' });
    },
    'start-free': () => enterRace({ mode: 'free', trackId: S.free.track, focus: S.free.focus, table: usesTable(S.free.focus) ? S.free.table : 0, from: 'vrij' }),
    'start': () => startRace(),
    'pause': () => openPause(),
    'resume': () => closePause(),
    'stop-race': () => stopRace(),
    'digit': el => pressDigit(el.dataset.d),
    'del': () => pressDel(),
    'ok': () => submitAnswer(),
    'next': () => nextAfterExplain(),
    'finish-garage': () => leaveFinish('menu'),
    'finish-again': () => leaveFinish('again'),
    'rest-stop': () => show('tot-ziens'),
    'rest-more': () => { S.races = 0; show('menu'); },
    'restart': () => { S.store.select(null); newSitting(); show('spelers'); },
    'print': () => window.print(),
    'toggle-setting': el => changeSetting(el.dataset.setting, el.getAttribute('aria-pressed') !== 'true'),
    'ask-reset': el => { S.confirm = { kind: 'reset', id: el.dataset.id }; rerender('ouders'); },
    'ask-remove': el => { S.confirm = { kind: 'remove', id: el.dataset.id }; rerender('ouders'); },
    'confirm-cancel': () => { S.confirm = null; rerender('ouders'); },
    'confirm-yes': () => {
      const c = S.confirm;
      const p = S.store.players().filter(x => x.id === (c && c.id))[0];
      S.confirm = null;
      if (!c || !p) { rerender('ouders'); return; }
      if (c.kind === 'reset') { S.store.resetProgress(p.id); S.notice = TXT.ouders.resetDone(p.name); }
      else { S.store.removePlayer(p.id); S.notice = TXT.ouders.removeDone(p.name); }
      rerender('ouders');
    }
  };

  const CHANGES = {
    'setting': el => changeSetting(el.dataset.setting, el.checked),
    'rest': el => S.store.setSetting('restAfter', Number(el.value)),
    'grade': el => S.store.setGrade(el.dataset.id, Number(el.value)),
    'free-track': el => { S.free.track = Number(el.value); },
    'free-focus': el => { S.free.focus = el.value; byId('fs-table').hidden = !usesTable(el.value); },
    'free-table': el => { S.free.table = Number(el.value); }
  };

  const FORMS = { 'new-player': submitNewPlayer };

  function onClick(ev) {
    const el = ev.target.closest('[data-action]');
    if (!el || el.disabled || !el.isConnected) return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    const sfx = el.dataset.sfx === undefined ? 'tap' : el.dataset.sfx;
    if (sfx) RR.Sound.play(sfx);
    fn(el, ev);
    // After a mouse or touch tap on a key, let go of focus so a physical Enter does not press that key again.
    if (ev.detail > 0 && el.classList.contains('key')) el.blur();
  }

  function onChange(ev) {
    const el = ev.target.closest('[data-change]');
    if (!el) return;
    const fn = CHANGES[el.dataset.change];
    if (fn) { RR.Sound.play('tap'); fn(el); }
  }

  function onSubmit(ev) {
    ev.preventDefault();
    const fn = FORMS[ev.target.dataset.form];
    if (fn) fn(ev.target);
  }

  function onKey(ev) {
    if (ev.defaultPrevented || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (byId('dlg-pause').open) return;
    const R = S.race;
    if (S.screen !== 'race' || !R) return;
    const onControl = !!ev.target.closest('button, a, input, select, textarea');
    if (ev.key === 'Escape') {
      if (R.phase !== 'intro') { ev.preventDefault(); openPause(); }
      return;
    }
    if (R.phase === 'ask') {
      if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); if (!ev.repeat) pressDigit(ev.key); }
      else if (ev.key === 'Backspace') { ev.preventDefault(); pressDel(); }
      else if (ev.key === 'Enter' && !onControl) { ev.preventDefault(); submitAnswer(); }
    } else if (R.phase === 'explain' && ev.key === 'Enter' && !onControl) {
      ev.preventDefault();
      nextAfterExplain();
    }
  }

  // ---------- start-up ----------
  function buildToolIcons() {
    $$('.ico').forEach(s => {
      s.setAttribute('fill', 'none');
      s.setAttribute('stroke', 'currentColor');
      s.setAttribute('stroke-width', '1.6');
      s.setAttribute('stroke-linejoin', 'round');
      s.setAttribute('stroke-linecap', 'butt');
    });
  }

  function buildKeypad() {
    const pad = byId('keypad');
    KEYS.forEach(k => {
      if (k === 'del') {
        const icon = svg('svg', { viewBox: '0 0 20 14', 'aria-hidden': 'true', focusable: 'false', class: 'ico-del' });
        icon.appendChild(svg('path', { d: 'M7 1.5h11.5v11H7L1.5 7z' }));
        icon.appendChild(svg('path', { d: 'M10.5 4.5l5 5M15.5 4.5l-5 5' }));
        pad.appendChild(h('button', { type: 'button', class: 'key key-del', 'data-action': 'del', 'data-sfx': '', 'aria-label': TXT.race.del }, icon));
      } else if (k === 'ok') {
        pad.appendChild(h('button', { type: 'button', class: 'key key-ok', 'data-action': 'ok', 'data-sfx': '' }, TXT.race.check));
      } else {
        pad.appendChild(h('button', { type: 'button', class: 'key', 'data-action': 'digit', 'data-d': k, 'data-sfx': '' }, k));
      }
    });
  }

  function fillStaticText() {
    $$('[data-txt]').forEach(el => { el.textContent = txt(el.dataset.txt); });
    $$('[data-txt-label]').forEach(el => { el.setAttribute('aria-label', txt(el.dataset['txtLabel'])); });
    byId('btn-sound').setAttribute('aria-label', TXT.header.sound);
    byId('btn-sound').title = TXT.header.sound;
    byId('btn-music').setAttribute('aria-label', TXT.header.music);
    byId('btn-music').title = TXT.header.music;
    byId('brand-icon').src = RR.Sprites.iconURL('flag', 1);
  }

  function unlockSoundOnce() {
    const events = ['pointerup', 'click', 'keydown'];
    const handler = () => {
      RR.Sound.unlock();
      if (RR.Sound.isUnlocked()) events.forEach(e => document.removeEventListener(e, handler, true));
    };
    events.forEach(e => document.addEventListener(e, handler, true));
  }

  function init() {
    const mql = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    S.reduced = !!(mql && mql.matches);
    S.store = RR.Store.create(RR.Store.browserStorage(), () => Date.now());
    S.store.select(null);            // the game always starts at the player chooser

    S.canvas = h('canvas', { class: 'scene', role: 'img', 'aria-label': TXT.menu.sceneLabel });
    S.frame = h('div', { class: 'scene-frame' }, S.canvas);
    S.scene = RR.Scene.create(S.canvas, { reducedMotion: S.reduced });
    if (mql) {
      const onMotion = () => { S.reduced = mql.matches; S.scene.setReducedMotion(S.reduced); };
      if (mql.addEventListener) mql.addEventListener('change', onMotion); else if (mql.addListener) mql.addListener(onMotion);
    }

    buildToolIcons();
    buildKeypad();
    fillStaticText();
    applyLayoutClasses();
    applySettings();

    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', onKey);
    byId('dlg-pause').addEventListener('click', ev => {
      const r = ev.currentTarget.getBoundingClientRect();
      const outside = ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
      if (ev.target === ev.currentTarget && outside) closePause();
    });
    unlockSoundOnce();

    const refit = () => { applyLayoutClasses(); queueFit(); };
    window.addEventListener('resize', refit);
    window.addEventListener('orientationchange', refit);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(queueFit);
      ro.observe(byId('race-body'));
      ro.observe(byId('main'));
    }

    show(S.store.players().length ? 'spelers' : 'nieuw');
  }

  init();

  // Hooks for the browser tests; the game itself never reads them.
  return { state: S, show: show, fitScene: fitScene };
})();
</script>
</body>
</html>
