<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The privacy promise, enforced by the browser: nothing leaves this page and nothing is loaded from outside. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2b4a84">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>Rekenrace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231f7a82'/%3E%3Cpath fill='%23fbf6e9' d='M3 2h2v12H3z'/%3E%3Cpath fill='%23fbf6e9' d='M5 3h8v6H5z'/%3E%3Cpath fill='%23232c4a' d='M5 3h2v2H5zM9 3h2v2H9zM7 5h2v2H7zM11 5h2v2h-2zM5 7h2v2H5zM9 7h2v2H9z'/%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------- */
:root{
  /* the palette of RR.Sprites.PALETTE (the browser test checks that these still match) */
  --pal-navy:#232c4a; --pal-brown:#4b3028; --pal-slate:#5d6a86; --pal-grey:#98a3b6; --pal-silver:#cdd5e0;
  --pal-white:#fbf6e9; --pal-cream:#f2dfb8; --pal-sand:#e5c487; --pal-tan:#c4955a; --pal-bark:#8b5a38;
  --pal-orange:#e57f36; --pal-rust:#ab4e22; --pal-apricot:#f4b268; --pal-red:#c2493d; --pal-brick:#8f3b34;
  --pal-pink:#e58aa3; --pal-blush:#f6c3cf; --pal-yellow:#efcc52; --pal-gold:#bf8e26; --pal-teal:#1f7a82;
  --pal-deepteal:#174f5c; --pal-aqua:#86d1c6; --pal-blue:#4678bd; --pal-deepblue:#2b4a84; --pal-sky:#a8d5ee;
  --pal-ice:#def0f7; --pal-purple:#573b8a; --pal-plum:#3f2d68; --pal-lilac:#b7a0d8; --pal-green:#5a9e48;
  --pal-fir:#2c6338; --pal-lime:#a6cc70;

  --ink:var(--pal-navy);
  --muted:#475473;              /* slate, a bit darker so it keeps 4.5:1 on cream */
  --face:var(--pal-cream);      /* window surface */
  --paper:var(--pal-white);     /* fields, cards, button faces */
  --hi:#fffdf7;                 /* bevel: light edge */
  --lo:var(--pal-bark);         /* bevel: dark edge */
  --edge:var(--pal-navy);
  --primary:var(--pal-deepteal);
  --note-bg:#fbe6c2;
  --focus:var(--pal-deepblue);
  --font:"Comic Sans MS","Chalkboard SE","Trebuchet MS",Verdana,sans-serif;

  --key-h:clamp(56px,8.4vh,76px);
  --right-min:272px;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  font-size:18px;
  line-height:1.35;
  color:var(--ink);
  background-color:var(--pal-aqua);
  background-image:repeating-conic-gradient(var(--pal-sky) 0% 25%, var(--pal-aqua) 0% 50%);
  background-size:4px 4px;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
[hidden]{display:none !important}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
img,svg{display:block}
.pix{image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
.sr-only,.vh{position:absolute !important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.noscript{position:fixed;inset:auto 16px 16px;padding:12px 16px;background:var(--paper);border:2px solid var(--edge)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.screen-title:focus{outline:none}
#q:focus{outline:none}

/* ---------- the window on the desktop ---------- */
.desk{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.window{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--face);overflow:hidden;
}
@media (min-width:760px) and (min-height:560px){
  .desk{padding:16px}
  .window{
    max-width:1300px;max-height:880px;
    border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
    outline:2px solid var(--edge);outline-offset:0;
    box-shadow:8px 8px 0 rgba(35,44,74,.35);
  }
}

.titlebar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:56px;padding:4px 8px 4px 14px;
  background:linear-gradient(90deg,var(--pal-deepblue) 0,var(--pal-deepblue) 38%,var(--pal-blue) 100%);   /* solid behind the name */
  color:var(--pal-white);
  border-bottom:2px solid var(--edge);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{width:20px;height:20px;border:1px solid var(--pal-white);background:var(--pal-white)}
.brand-name{font-weight:700;font-size:1.25rem;letter-spacing:.03em;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.tool{
  min-width:48px;min-height:48px;padding:0 10px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
  box-shadow:0 0 0 1px var(--edge);
}
.tool:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);transform:translate(1px,1px)}
.tool:focus-visible{outline:3px solid var(--pal-yellow);outline-offset:3px}
.tool-nav{font-weight:700;padding:0 16px}
.ico{width:28px;height:28px}
.ico .off-mark{display:none}
.tool[aria-pressed="false"] .on-mark{display:none}
.tool[aria-pressed="false"] .off-mark{display:block}
.tool[aria-pressed="true"]{background:var(--pal-aqua)}
.tool[aria-pressed="true"]:active{background:var(--pal-aqua)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{--pad:16px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--pad);display:flex;flex-direction:column}
.screen:not([hidden]){animation:fade-in .18s ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.page{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page-form{max-width:760px}
.page-center{align-items:center;text-align:center;flex:1;gap:28px}
.page-center > :first-child{margin-top:auto}
.page-center > :last-child{margin-bottom:auto}
.screen-title{font-size:clamp(1.55rem,4.2vw,2.1rem);line-height:1.2;overflow-wrap:anywhere}
.lead{font-size:1.05rem;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
.note{padding:8px 12px;font-size:.92rem}
.quiet-note{color:var(--muted);text-align:center}
.foot{text-align:center;margin-top:4px}
.notice{padding:10px 14px;background:var(--note-bg);border:2px solid var(--pal-orange)}

/* ---------- bevelled things ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;
  min-height:48px;padding:8px 20px;font-weight:700;line-height:1.2;
  background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
  box-shadow:0 0 0 1px var(--edge);
  -webkit-user-select:none;user-select:none;
}
.btn:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);transform:translate(1px,1px)}
.btn.primary{background:var(--primary);color:var(--pal-white);border-color:var(--pal-teal) var(--pal-navy) var(--pal-navy) var(--pal-teal)}
.btn.primary:active{border-color:var(--pal-navy) var(--pal-teal) var(--pal-teal) var(--pal-navy)}
.btn.danger{background:var(--pal-rust);color:var(--pal-white);border-color:var(--pal-orange) var(--pal-brown) var(--pal-brown) var(--pal-orange)}
.btn.big{min-height:56px;font-size:1.2rem;padding:10px 30px}
.btn.huge{min-height:72px;font-size:1.5rem;padding:12px 56px}
.btn.small{min-height:48px;padding:6px 16px}
.btn.quiet{background:none;border-color:transparent;box-shadow:none;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.btn.quiet:active{transform:none}
.btn:disabled{cursor:default}

.panel{
  background:var(--paper);padding:14px 16px;
  border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
  box-shadow:0 0 0 1px var(--edge);
}

@media (hover:hover){
  .btn:not(.primary):not(.danger):not(.quiet):hover,.tool:hover,.menu-btn:hover,.pcard:hover,.key:not(.key-ok):hover,.track:not(:disabled):hover,.chip label:hover,.hero-card label:hover{background-color:#fffef9}
  .btn.primary:hover,.key-ok:hover{background-color:var(--pal-teal)}
  .btn.quiet:hover{color:var(--ink)}
}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:20px}
.field,.fieldset{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.label{font-weight:700;font-size:1.05rem;padding:0}
.text-in,.select{
  min-height:52px;padding:8px 12px;font-size:1.25rem;background:#fff;color:var(--ink);
  border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 1px var(--edge);border-radius:0;
  max-width:100%;
}
.select{font-size:1.05rem;min-height:48px;padding-right:8px}
.text-in{width:100%;max-width:360px}
.field-error{color:#7a2e12;background:var(--note-bg);border-left:6px solid var(--pal-orange);padding:6px 10px;font-size:.95rem}
.form-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding-top:4px}
.form-actions.stack{flex-direction:column;gap:20px}
.field-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.check{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-size:1.05rem}
.check input{width:24px;height:24px;margin:0;accent-color:var(--primary);flex:none}

/* radio chips: 90s radio buttons on a bevelled face */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip label{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;cursor:pointer;
  background:var(--paper);touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
}
.chip label::before{
  content:"";flex:none;width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;background:#fff;
}
.chip input:checked + label{
  background:#e6f3ee;font-weight:700;
  border-color:var(--lo) var(--hi) var(--hi) var(--lo);
}
.chip input:checked + label::before{background:radial-gradient(circle,var(--ink) 0 4px,#fff 5px)}
.chip input:focus-visible + label{outline:3px solid var(--focus);outline-offset:3px}
.chip input:disabled + label{opacity:.6;cursor:default}
.chip-num label{min-width:48px;justify-content:center;padding:6px 8px}
.chip-num label::before{display:none}
.chip-num input:checked + label{background:var(--primary);color:var(--pal-white)}
.chip-icon{width:20px;height:20px;flex:none}
.chips-tracks .chip{flex:1 1 165px}
.chips-tracks .chip label{height:100%}

.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hero-card{position:relative}
.hero-card label{
  display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;padding:12px 10px 12px;text-align:center;cursor:pointer;
  background:var(--paper);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
}
.hero-card label::before{
  content:"";position:absolute;left:10px;top:10px;width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;background:#fff;
}
.hero-card input:checked + label{background:#e6f3ee;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 1px var(--edge),0 0 0 4px var(--primary)}
.hero-card input:checked + label::before{background:radial-gradient(circle,var(--ink) 0 4px,#fff 5px)}
.hero-card input:focus-visible + label{outline:3px solid var(--focus);outline-offset:5px}
.hero-name{font-weight:700}
.hero-tag{font-size:.85rem;color:var(--muted);line-height:1.3}
@media (min-width:700px){.hero-grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- player chooser ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;padding:14px 10px;cursor:pointer;
  background:var(--paper);touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
}
.pcard:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.pcard-head{width:60px;height:60px}
.pcard-name{font-weight:700;font-size:1.15rem;overflow-wrap:anywhere;max-width:100%}
.pcard-sub{font-size:.9rem;color:var(--muted)}
.pcard-new{background:transparent;border:2px dashed var(--muted);box-shadow:none}
.pcard-new:active{border-color:var(--muted)}
.plus{font-size:3rem;line-height:1;font-weight:700;color:var(--muted)}

/* ---------- garage ---------- */
.menu-layout{width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.menu-left,.menu-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.menu-head{display:flex;align-items:center;gap:14px}
.menu-hero{width:96px;height:66px;flex:none}
.menu-greet{min-width:0}
.menu-ask{color:var(--muted)}
.menu-list{display:flex;flex-direction:column;gap:12px}
.menu-btn{
  display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;text-align:left;cursor:pointer;
  background:var(--paper);touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
}
.menu-btn:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.menu-icon{width:40px;height:40px;flex:none}
.menu-text{display:flex;flex-direction:column;min-width:0}
.menu-title{font-weight:700;font-size:1.2rem}
.menu-sub{font-size:.9rem;color:var(--muted)}
.is-wide .menu-layout{flex-direction:row;align-items:center;justify-content:center;gap:28px;margin:auto}
.is-wide .menu-left{flex:0 0 var(--left-w,56%)}
.is-wide .menu-right{flex:1 1 0;max-width:420px;min-width:240px}

/* ---------- rest moment and goodbye ---------- */
.rest-kart{width:128px;height:88px}

/* ---------- the scene (canvas) ---------- */
canvas.scene{display:block;width:100%;height:auto;aspect-ratio:20/9;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
.scene-frame{
  display:block;line-height:0;background:var(--pal-navy);flex:none;
  border:4px solid;border-color:var(--pal-slate) var(--hi) var(--hi) var(--pal-slate);box-shadow:0 0 0 1px var(--edge);
  max-width:100%;
}
.scene-slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.scene-slot[data-fit="width"]{width:100%}

/* ---------- championship track list ---------- */
.trail{display:flex;flex-direction:column;gap:14px;position:relative}
.trail-item{position:relative}
.trail-item + .trail-item::before{
  content:"";position:absolute;left:50%;top:-14px;height:14px;border-left:3px dotted var(--lo);
}
@media (min-width:640px){
  .trail-item:nth-child(odd){padding-right:7%}
  .trail-item:nth-child(even){padding-left:7%}
}
.track{
  display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px;text-align:left;cursor:pointer;
  background:var(--paper);touch-action:manipulation;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
}
.track:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.track.is-next{box-shadow:0 0 0 1px var(--edge),0 0 0 5px var(--primary);background:#e6f3ee}
.track.is-locked{background:var(--face);color:var(--muted);cursor:default;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.track-icon{width:60px;height:60px;flex:none}
.track.is-locked .track-icon{opacity:.8}
.track-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.track-name{font-weight:700;font-size:1.15rem}
.track-blurb{font-size:.9rem;color:var(--muted);line-height:1.3}
.track-tag{align-self:flex-start;margin-top:4px;padding:1px 8px;font-size:.8rem;font-weight:700;background:var(--pal-ice);border:1px solid var(--pal-navy);color:var(--ink)}
.track.is-next .track-tag{background:var(--primary);color:var(--pal-white)}

/* ---------- the race ---------- */
.screen.race{padding:10px 14px 12px}
.race-line{flex:none;display:flex;align-items:center;column-gap:12px;row-gap:2px;min-height:48px}
.race-title{flex:1 1 auto;min-width:0;font-size:1.25rem;overflow-wrap:anywhere}
.race-progress{flex:none;margin-left:auto;font-weight:700;font-size:1.05rem;white-space:nowrap}
.race-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.race-body > :first-child{margin-top:auto}
.race-body > :last-child{margin-bottom:auto}      /* centres when there is room, never cuts off when there is not */
.race-left{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.race-left .scene-slot{flex:1;min-height:110px}
.race-right{flex:none;display:grid;grid-template-columns:minmax(0,1fr);row-gap:8px;align-content:start;min-width:0;position:relative}

.q{
  grid-row:1;grid-column:1;min-height:5.2rem;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--paper);padding:8px 12px;
  border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 1px var(--edge);
  font-size:clamp(1.9rem,8vw,2.7rem);font-weight:700;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.q.q-long{font-size:clamp(1.5rem,6.6vw,2.2rem)}
.q.q-story{font-size:clamp(1.05rem,4.4vw,1.35rem);text-align:left;justify-content:flex-start;white-space:normal;font-weight:700;line-height:1.3}
.answer{
  grid-row:2;grid-column:1;min-height:56px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 1px var(--edge);
  font-size:2rem;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums;
}
.answer[data-empty="true"]::after{content:"_";color:var(--pal-grey)}
.feedback{
  grid-row:3;grid-column:1;min-height:2.9rem;padding:4px 10px;font-size:.98rem;line-height:1.3;display:flex;align-items:center;
}
.feedback[data-tone="ok"]{color:var(--pal-deepteal)}
.feedback[data-tone="note"]{background:var(--note-bg);border-left:6px solid var(--pal-orange);color:var(--ink)}
.fb-main{font-weight:700;margin-right:.35em}
.feedback[data-tone="ok"] .fb-main{font-size:1.1rem}

.keypad{grid-row:4;grid-column:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{
  min-height:var(--key-h);font-size:1.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--paper);touch-action:manipulation;font-variant-numeric:tabular-nums;
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 1px var(--edge);
  -webkit-user-select:none;user-select:none;
}
.key:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);transform:translate(1px,1px)}
.key-ok{background:var(--primary);color:var(--pal-white);font-size:1.3rem;border-color:var(--pal-teal) var(--pal-navy) var(--pal-navy) var(--pal-teal)}
.key-ok:active{border-color:var(--pal-navy) var(--pal-teal) var(--pal-teal) var(--pal-navy)}
.ico-del{width:34px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.race[data-phase="gliding"] .keypad,.race[data-phase="done"] .keypad{opacity:.55}

.explain{
  display:none;grid-row:2 / span 3;grid-column:1;flex-direction:column;gap:8px;min-height:0;overflow:hidden;
  background:var(--note-bg);border-color:var(--pal-orange);
}
.explain-answer{font-weight:700;font-size:1.25rem}
.explain-text{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:1rem;line-height:1.35}
.explain .btn{align-self:stretch}

.intro{grid-row:1 / span 4;grid-column:1;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.intro-title{font-size:1.5rem}
.intro-blurb{font-size:1.05rem}
.intro-extra{font-size:.95rem;color:var(--muted)}

/* what is visible in which phase */
.race[data-phase="intro"] .race-line,
.race[data-phase="intro"] .q,.race[data-phase="intro"] .answer,.race[data-phase="intro"] .feedback,.race[data-phase="intro"] .keypad{display:none}
.race:not([data-phase="intro"]) .intro{display:none}
.race[data-phase="explain"] .explain{display:flex}
.race[data-phase="explain"] .answer,.race[data-phase="explain"] .feedback,.race[data-phase="explain"] .keypad{visibility:hidden}

/* two columns: title and scene on the left, sum and keypad on the right */
.is-wide .race-body{display:grid;grid-template-columns:var(--scene-col,1fr) minmax(0,1fr);column-gap:24px;align-items:center}
.is-wide .race-body > :first-child,.is-wide .race-body > :last-child{margin:0}
.is-wide .race-left{display:flex;flex-direction:column;gap:8px}
.is-wide .race-left .scene-slot{display:block;flex:none;min-height:0}
.is-wide .race-line{flex-wrap:wrap}
.is-wide .race-title{flex-basis:8rem}
.is-wide .race-right{align-content:center}
.is-wide .q{font-size:clamp(1.9rem,3.4vw,2.7rem)}
.is-wide .q.q-long{font-size:clamp(1.5rem,2.8vw,2.1rem)}
.is-wide .q.q-story{font-size:clamp(.95rem,1.35vw,1.15rem)}
.is-wide .keypad{--key-h:clamp(52px,8vh,64px)}

/* wide and low (a phone held sideways): a flatter keypad, everything must fit without scrolling */
.is-wide.is-short{--right-min:352px}
.is-wide.is-short .keypad{--key-h:48px}
.is-wide.is-short .screen.race{padding:4px 12px 6px}
.is-wide.is-short .race-line{min-height:48px}
.is-wide.is-short .race-title{font-size:1.05rem}
.is-wide.is-short .race-progress{font-size:.95rem}
.is-wide.is-short .keypad{grid-template-columns:repeat(6,1fr);gap:6px}
.is-wide.is-short .key{font-size:1.4rem}
.is-wide.is-short .key-ok{font-size:1.05rem}
.is-wide.is-short .q{min-height:3.2rem;font-size:clamp(1.5rem,5vw,2rem)}
.is-wide.is-short .q.q-long{font-size:1.4rem}
.is-wide.is-short .q.q-story{font-size:.95rem;line-height:1.25;min-height:3.2rem}
.is-wide.is-short .answer{min-height:44px;font-size:1.6rem}
.is-wide.is-short .feedback{min-height:2.4rem;font-size:.9rem;padding:2px 8px}
.is-wide.is-short .race-right{row-gap:4px}
.is-wide.is-short .explain{padding:8px 12px;gap:4px}
.is-wide.is-short .explain-answer{font-size:1.1rem}
.is-wide.is-short .explain-text{font-size:.9rem;gap:2px}
.is-wide.is-short .explain .btn{min-height:48px;padding-top:4px;padding-bottom:4px}
.is-wide.is-short .intro{gap:8px;padding:10px 14px}
.is-wide.is-short .intro-title{font-size:1.25rem}
.is-wide.is-short .intro-blurb{font-size:.95rem}

/* ---------- wide and low screens: garage and finish a bit more compact ---------- */
.is-wide.is-short .screen{--pad:8px;padding:var(--pad) 14px}
.is-wide.is-short .menu-layout{gap:20px}
.is-wide.is-short .menu-left,.is-wide.is-short .menu-right{gap:8px}
.is-wide.is-short .menu-list{gap:8px}
.is-wide.is-short .menu-btn{min-height:52px;padding:4px 14px}
.is-wide.is-short .menu-icon{width:32px;height:32px}
.is-wide.is-short .menu-title{font-size:1.1rem}
.is-wide.is-short .menu-sub{font-size:.85rem}
.is-wide.is-short .foot{margin:0}
.is-wide.is-short .stand-row{min-height:36px;padding:1px 8px}
.is-wide.is-short .standings{gap:2px}
.is-wide.is-short .finish-card{padding:8px 12px;gap:6px}
.is-wide.is-short .fact{font-size:1rem;padding-top:4px}
.is-wide.is-short .finish-actions{padding-top:6px}
.is-wide.is-short .stand-head{width:28px;height:28px}
.is-wide.is-short .screen-title{font-size:1.45rem}
.is-wide.is-short .page{gap:10px}
.is-wide.is-short .page-center{gap:12px}
.is-wide.is-short .rest-kart{width:96px;height:66px}
.is-wide.is-short .btn.huge{min-height:60px}

/* ---------- finish ---------- */
.finish-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.finish-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.finish-card{display:flex;flex-direction:column;gap:12px}
.finish-side{display:flex;flex-direction:column;gap:14px}
.standings{display:flex;flex-direction:column;gap:6px}
.stand-row{display:flex;align-items:center;gap:12px;padding:4px 8px;min-height:48px}
.stand-row.is-me{background:#e6f3ee;border:2px solid var(--primary)}
.stand-place{width:1.6em;font-weight:700;text-align:right}
.stand-head{width:36px;height:36px;flex:none}
.stand-name{font-size:1.05rem;overflow-wrap:anywhere}
.stand-you{color:var(--muted)}
.fact{font-size:1.1rem;font-weight:700;padding-top:6px;border-top:2px dotted var(--lo)}
.stamp-got{display:flex;align-items:center;gap:14px}
.stamp-pic{width:60px;height:60px;flex:none}
.practise h2{font-size:1.15rem}
.practise-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.finish-actions{margin-top:6px;position:sticky;bottom:calc(-1 * var(--pad));padding:10px 0 var(--pad);background:linear-gradient(to bottom,transparent,var(--face) 12px)}

/* ---------- stamp card ---------- */
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;background:var(--paper);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:0 0 0 1px var(--edge)}
.slot-icon{width:80px;height:80px}
.slot-name{font-weight:700}
.slot-date{font-size:.85rem;color:var(--muted)}

/* ---------- licence ---------- */
.page-licence{max-width:760px}
.licence{
  background:var(--paper);border:3px solid var(--pal-deepblue);box-shadow:0 0 0 1px var(--edge),0 0 0 6px var(--pal-sand),0 0 0 7px var(--edge);
  padding:0 0 14px;margin:8px 8px 14px;
}
.licence-band{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--pal-deepblue),var(--pal-blue));color:var(--pal-white);border-bottom:3px solid var(--pal-yellow)}
.licence-flag{width:40px;height:40px;background:var(--pal-white);border:1px solid var(--pal-white)}
.licence-title{font-size:clamp(1.4rem,4.4vw,2rem);letter-spacing:.14em;text-transform:uppercase}
.licence-main{display:flex;align-items:center;gap:20px;padding:16px 20px}
.licence-kart{width:128px;height:88px;flex:none}
.licence-who{display:flex;flex-direction:column;gap:4px;min-width:0}
.licence-label{font-size:.85rem;color:var(--muted)}
.licence-name{font-size:1.9rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.licence-text{font-size:1rem}
.licence-date{font-size:.95rem;color:var(--muted)}
.licence-stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;padding:0 14px}
.licence-stamps li{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;text-align:center}
.licence-stamp{width:60px;height:60px}
@media (min-width:700px){
  .licence-stamps{grid-template-columns:repeat(8,1fr)}
  .licence-stamp{width:60px;height:60px}
}
@media (max-width:520px){.licence-main{flex-direction:column;text-align:center}}

/* ---------- parents ---------- */
.pl-card{display:flex;flex-direction:column;gap:10px}
.pl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pl-head-img{width:48px;height:48px;flex:none}
.pl-name{font-size:1.35rem;flex:1 1 auto;overflow-wrap:anywhere}
.pl-grade{display:flex;align-items:center;gap:8px}
.pl-card h3,.settings h2,.about h2{font-size:1.05rem}
.kinds{display:flex;flex-direction:column;gap:8px}
.kinds li{display:flex;flex-direction:column;gap:3px}
.kind-text{font-size:1rem}
.bar{display:block;height:10px;background:#fff;border:1px solid var(--edge);max-width:420px}
.bar-fill{display:block;height:100%;background:var(--pal-teal)}
.tricky{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px}
.confirm{display:flex;flex-direction:column;gap:10px;padding:10px 12px;background:var(--note-bg);border:2px solid var(--pal-orange)}
.confirm-text{font-weight:700}
.settings{display:flex;flex-direction:column;gap:6px}
.about{display:flex;flex-direction:column;gap:6px;color:var(--muted);padding-bottom:12px}
.about h2{color:var(--ink)}

/* ---------- pause dialog ---------- */
.dialog{
  width:min(92vw,440px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;padding:20px 22px;background:var(--face);color:var(--ink);
  border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);outline:2px solid var(--edge);
  box-shadow:8px 8px 0 rgba(35,44,74,.35);
}
.dialog::backdrop{background:rgba(35,44,74,.5)}
.dialog h2{font-size:1.5rem;margin-bottom:6px}
.dialog-note{color:var(--muted);margin-bottom:10px}
.dialog-settings{display:flex;flex-direction:column;margin-bottom:14px}
.dialog-actions{display:flex;flex-direction:column;gap:12px}
.is-short .dialog{padding:12px 18px}
.is-short .dialog h2{font-size:1.25rem;margin-bottom:2px}
.is-short .dialog-note{margin-bottom:4px;font-size:.95rem}
.is-short .dialog-settings{margin-bottom:6px}
.is-short .dialog-actions{gap:8px}

/* ---------- small portrait phones (for example 360 x 640) ---------- */
@media (max-height:720px) and (max-width:639px){
  .screen.race{padding:6px 10px 8px;gap:6px}
  .race-body{gap:6px}
  .race-left .scene-slot{min-height:96px}
  .race-right{row-gap:6px}
  .q{min-height:3.7rem;font-size:clamp(1.6rem,7.4vw,2.2rem)}
  .q.q-long{font-size:clamp(1.3rem,6vw,1.8rem)}
  .q.q-story{min-height:3.7rem;font-size:clamp(.95rem,4.2vw,1.1rem);line-height:1.25}
  .answer{min-height:48px;font-size:1.7rem}
  .feedback{min-height:2.5rem;font-size:.92rem;padding:2px 8px}
  .keypad{--key-h:48px;gap:6px}
  .explain{padding:8px 12px}
}

/* ---------- small screens ---------- */
@media (max-width:520px){
  body{font-size:17px}
  .screen{--pad:12px}
  .screen.race{padding:8px 10px 10px}
  .brand-name{font-size:1.1rem}
  .titlebar{padding-left:10px}
}

/* ---------- printing: only the licence ---------- */
@page{size:A5 landscape;margin:10mm}
@media print{
  html,body{height:auto;overflow:visible;background:#fff !important}
  .desk{display:block;height:auto;padding:0}
  .window{display:block;height:auto;max-width:none;max-height:none;border:0;outline:0;box-shadow:none;background:#fff;overflow:visible}
  .titlebar,.no-print,#announce,.dialog,.noscript{display:none !important}
  .body{display:block;overflow:visible}
  .screen{display:none !important}
  #s-rijbewijs{display:block !important;overflow:visible;padding:0;animation:none}
  .page-licence{max-width:none}
  .licence{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  .licence *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* fill the A5 page: the kart at 8x, a bigger name, the 8 stamps in one row */
  .licence-band{padding:14px 24px}
  .licence-title{font-size:2.4rem}
  .licence-flag{width:60px;height:60px}
  .licence-main{padding:26px 30px;gap:30px}
  .licence-kart{width:256px;height:176px}
  .licence-name{font-size:3rem}
  .licence-text{font-size:1.3rem}
  .licence-date{font-size:1.1rem}
  .licence-label{font-size:1rem}
  .licence-stamps{grid-template-columns:repeat(8,1fr);padding:6px 24px 16px;gap:4px}
  .licence-stamps li{font-size:.9rem}
}

/* ---------- less motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .btn:active,.key:active,.tool:active{transform:none}
}

<script>
const RR = {};
// ===PURE===
// Seedable RNG shared by the pure modules. No DOM, no globals except RR.
RR.Rng = (function () {
  'use strict';

  // mulberry32: small, fast, good enough for question generation
  function make(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Unseeded generator for real play; tests pass make(seed) instead.
  function random() {
    return make((Math.random() * 4294967296) >>> 0);
  }

  // Inclusive integer in [min, max]
  function int(rng, min, max) {
    return min + Math.floor(rng() * (max - min + 1));
  }

  function pick(rng, list) {
    return list[Math.floor(rng() * list.length)];
  }

  // Returns a shuffled copy (Fisher-Yates); the input is left untouched.
  function shuffle(rng, list) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  return { make, random, int, pick, shuffle };
})();
// Question engine for Rekenrace. Pure and DOM-free; only uses RR.Rng.
//
// Layout of this module:
//   1. helpers            small text/number utilities
//   2. method text        hint + explanation builders per operation (Dutch rekenmethode style)
//   3. builders           key -> Question, plus the matching difficulty score
//   4. stories            table-driven story templates (add one line to add a story)
//   5. profiles           per (grade, level) table that drives the whole ramp
//   6. samplers + plan    turn a profile row into concrete sums
//   7. make / series / fromKey / check
//
// Keys are the single source of truth: fromKey(key) rebuilds a question
// (hint and explanation included) from nothing but its key, so hints and
// explanations are chosen from the numbers (via a hash), never from the rng.
//   add:47+36  sub:83-47  times:7x8  div:56:8  gap:sub:?-8=15  story:eieren:6:8
//
// Decisions the contract leaves open:
//  - focus add / sub / story give only that kind. focus times / div give that
//    kind plus gap sums of the same operation (about one in three sums).
//  - table (1..10) restricts times, div and their gap sums; for division the
//    table is the divisor. With focus 'mix' a table turns the series into
//    times + div + gap(x, :) on that table. add/sub ignore it; stories use it
//    (table >= 2) as the "per group" number of a x or : story.
//  - repeat: at most two valid keys are woven in at places 2..5 (never first or
//    last). Keys that do not parse, fit the focus/table, or repeat a key or an
//    answer are skipped silently.
//  - series: each place takes a higher difficulty quantile from a small pool of
//    candidates (warm-up first, no gap/story at the start), never three equal
//    kinds in a row, never a repeated key or answer unless the space of sums
//    is too small to give `count` different answers.
//  - rng: a function is used as is, a number seeds a fresh generator, anything
//    else means unseeded.
//  - gap sums are "fair": the factor the child divides by is a table number (or
//    a round ten), and while tables are being learned one of the level's own
//    tables; "n : ? = q" only for a small q.
//  - stories: a template's `cap` keeps its numbers believable (no 4957 shells on
//    one beach); only the templates made for thousands (tulpenfeest, tickets,
//    bulbs, orchard) carry the big tiers.
RR.Questions = (function () {
  'use strict';

  const KINDS = { add: 'Optellen', sub: 'Aftrekken', times: 'Tafels', div: 'Delen', gap: 'Gaatjessommen', story: 'Verhaalsommen' };
  const FOCI = ['mix', 'add', 'sub', 'times', 'div', 'story'];
  const MINUS = '\u2212';
  const TIMES = '\u00d7';
  const OPSYM = { add: '+', sub: MINUS, times: TIMES, div: ':' };
  const OPKEY = { add: '+', sub: '-', times: 'x', div: ':' };
  const MAXV = 9999;

  // ---------------------------------------------------------------- helpers

  function rint(rng, lo, hi) { return RR.Rng.int(rng, lo, hi); }
  // a function is used as is, a number seeds a fresh generator, anything else
  // (undefined, a string, ...) means "unseeded"

        M(cnt(n / p, p) + ' : ' + d + ' = ' + cnt(q / p, p) + '.', 'Deel eerst de ' + PLACE[p][1] + '.');
      }
    }
    if (!c.length) M('Delen is het omgekeerde van keer: ' + q + ' ' + TIMES + ' ' + d + ' = ' + n + '.', 'Welk getal keer ' + d + ' is ' + n + '?', inverse);
    return c;
  }

  function timesHow(a, b, k) { return choose(timesMethods(a, b), k, 'times').how; }
  function divHow(n, d, k) { return choose(divMethods(n, d), k, 'div').how; }

  // --------------------------------------------------------------- builders
  // A descriptor is a cheap handle { key, kind, ans, d, make }: samplers create
  // many of them, only the chosen ones pay for make() (hint + explanation).

  const FB = {
    add: 'Reken stap voor stap.',
    sub: 'Reken stap voor stap.',
    times: 'Denk aan de tafel die erbij hoort.',
    div: 'Denk aan de keersom die erbij hoort.',
    gap: 'Welk getal hoort er op de plek van het vraagteken?',
    story: 'Lees de som nog eens rustig en bedenk wat je moet doen.'
  };

  function mk(key, kind, text, answer, hint, explain, formula) {
    return { key, kind, text, answer, hint, explain, formula };
  }

  // relative difficulty, only used to order sums inside one series
  const TBL = [0, 0, 0.1, 0.5, 0.6, 0.2, 0.9, 1, 1, 0.9, 0.1];
  function factorHard(n) { return n <= 10 ? TBL[n] : 1 + 0.8 * Math.log10(n); }
  function dAdd(a, b) { return 0.75 * Math.log2(1 + Math.max(a, b)) + (carryAdd(a, b) ? 1 : 0) + (Math.min(a, b) >= 10 ? 0.5 : 0); }
  function dSub(a, b) { return 0.75 * Math.log2(1 + a) + (borrowSub(a, b) ? 1.2 : 0) + (b >= 10 ? 0.5 : 0); }
  function dTimes(a, b) { return 0.5 * Math.log2(1 + a * b) + Math.max(factorHard(a), factorHard(b)); }
  function dDiv(n, d) { return dTimes(d, n / d) + 0.4; }

  function arith(kind, key, text, ans, methods, eq, formula) {
    const m = choose(methods, key, kind);
    return mk(key, kind, text, ans, firstSafe([m.hint, m.alt, m.plain], ans, FB[kind]), wrap(m.how, 'Dus ' + eq + '.'), formula);
  }

  function descAdd(a, b) {
    const key = 'add:' + a + '+' + b, s = a + b;
    return { key, kind: 'add', ans: s, d: dAdd(a, b),
      make: () => arith('add', key, a + ' + ' + b + ' = ?', s, addMethods(a, b), a + ' + ' + b + ' = ' + s, a + '+' + b) };
  }

  function descSub(a, b) {
    const key = 'sub:' + a + '-' + b, r = a - b;
    return { key, kind: 'sub', ans: r, d: dSub(a, b),
      make: () => arith('sub', key, a + ' ' + MINUS + ' ' + b + ' = ?', r, subMethods(a, b), a + ' ' + MINUS + ' ' + b + ' = ' + r, a + '-' + b) };
  }

  function descTimes(a, b) {
    const key = 'times:' + a + 'x' + b, p = a * b;
    return { key, kind: 'times', ans: p, d: dTimes(a, b),
      make: () => arith('times', key, a + ' ' + TIMES + ' ' + b + ' = ?', p, timesMethods(a, b), a + ' ' + TIMES + ' ' + b + ' = ' + p, a + '*' + b) };
  }

  function descDiv(n, d) {
    const key = 'div:' + n + ':' + d, q = n / d;
    return { key, kind: 'div', ans: q, d: dDiv(n, d),
      make: () => arith('div', key, n + ' : ' + d + ' = ?', q, divMethods(n, d), n + ' : ' + d + ' = ' + q, n + '/' + d) };
  }

  // Gap sum from the complete equation a OP b = c; `unk` ('a' | 'b') is hidden.
  function gapParts(op, a, b, c, unk, key) {
    const ans = unk === 'a' ? a : b;
    const sym = OPSYM[op], full = a + ' ' + sym + ' ' + b + ' = ' + c;
    const text = (unk === 'a' ? '?' : a) + ' ' + sym + ' ' + (unk === 'b' ? '?' : b) + ' = ' + c;
    let hints, how, lead, formula, plain;
    if (op === 'add') {
      const k = unk === 'a' ? b : a;                      // the known addend
      formula = c + '-' + k;
      lead = text + ' betekent ' + c + ' ' + MINUS + ' ' + k + '.';
      how = subHow(c, k, key);
      hints = ['Wat moet er bij ' + k + ' om ' + c + ' te krijgen?', 'Maak er een minsom van: ' + c + ' ' + MINUS + ' ' + k + '.',
        'Tel op vanaf ' + k + ' tot je bij ' + c + ' komt.'];
      plain = 'Maak er een minsom van: de uitkomst min het getal dat je ziet.';
    } else if (op === 'sub' && unk === 'a') {
      formula = c + '+' + b;
      lead = text + ' betekent ' + c + ' + ' + b + '.';
      how = addHow(c, b, key);
      hints = ['Je haalt ' + b + ' weg en houdt ' + c + ' over. Hoeveel was het eerst?', 'Maak er een plussom van: ' + c + ' + ' + b + '.',
        'Draai de som om: wat moet je met ' + c + ' doen om weer bij het begin te komen?'];
      plain = 'Maak er een plussom van: de uitkomst plus het getal dat je ziet.';
    } else if (op === 'sub') {
      formula = a + '-' + c;
      lead = text + ' betekent ' + a + ' ' + MINUS + ' ' + c + '.';
      how = subHow(a, c, key);
      hints = ['Hoeveel haal je weg van ' + a + ' om ' + c + ' over te houden?', 'Maak er een minsom van: ' + a + ' ' + MINUS + ' ' + c + '.',
        'Tel op vanaf ' + c + ' tot je bij ' + a + ' komt.'];
      plain = 'Maak er een minsom van: het getal dat je ziet min de uitkomst.';
    } else if (op === 'times') {
      const k = unk === 'a' ? b : a;                      // the known factor
      formula = c + '/' + k;
      lead = text + ' betekent ' + c + ' : ' + k + '.';
      how = divHow(c, k, key);
      hints = ['Welk getal keer ' + k + ' is ' + c + '?', 'Delen is het omgekeerde van keer: ' + c + ' : ' + k + '.'];
      if (k <= 10 && c <= 10 * k) hints.push('Zeg de tafel van ' + k + ' op tot je bij ' + c + ' komt.');
      plain = 'Delen is het omgekeerde van keer: deel de uitkomst door het getal dat je ziet.';
    } else if (unk === 'a') {
      formula = c + '*' + b;
      lead = text + ' betekent ' + c + ' ' + TIMES + ' ' + b + '.';
      how = timesHow(c, b, key);
      hints = ['Maak er een keersom van: ' + c + ' ' + TIMES + ' ' + b + '.', 'Welk getal gedeeld door ' + b + ' geeft ' + c + '? Denk aan de keersom.'];
      plain = 'Maak er een keersom van: de uitkomst keer het getal dat je ziet.';
    } else {
      formula = a + '/' + c;
      lead = text + ': hoe vaak past ' + c + ' in ' + a + '?';
      how = divHow(a, c, key);
      hints = ['Hoe vaak past ' + c + ' in ' + a + '?', 'Welk getal keer ' + c + ' is ' + a + '?', 'Maak er een deelsom van: ' + a + ' : ' + c + '.'];
      plain = 'Hoe vaak past de uitkomst in het getal dat je ziet?';
    }
    return {
      text, ans, formula,
      hint: firstSafe(rotate(hints, key).concat(plain), ans, FB.gap),
      explain: wrap(lead + ' ' + how, 'Dus ' + full + '.')
    };
  }

  function descGap(op, a, b, c, unk) {
    const key = 'gap:' + op + ':' + (unk === 'a' ? '?' : a) + OPKEY[op] + (unk === 'b' ? '?' : b) + '=' + c;
    const base = op === 'add' ? dAdd(a, b) + 0.8 : op === 'sub' ? dSub(a, b) + 0.8 : op === 'times' ? dTimes(a, b) + 0.5 : dDiv(a, b) + 0.5;
    return {
      key, kind: 'gap', ans: unk === 'a' ? a : b, d: base,
      make: () => { const g = gapParts(op, a, b, c, unk, key); return mk(key, 'gap', g.text, g.ans, g.hint, g.explain, g.formula); }
    };
  }

  // ----------------------------------------------------------------- fromKey

  const NUM = '([1-9]\\d{0,3})';
  const RE_ADD = new RegExp('^add:' + NUM + '\\+' + NUM + '$');
  const RE_SUB = new RegExp('^sub:' + NUM + '-' + NUM + '$');
  const RE_TIMES = new RegExp('^times:' + NUM + 'x' + NUM + '$');
  const RE_DIV = new RegExp('^div:' + NUM + ':' + NUM + '$');
  const RE_GAP = /^gap:(add|sub|times|div):([1-9]\d{0,3}|\?)([-+x:])([1-9]\d{0,3}|\?)=(0|[1-9]\d{0,3})$/;
  const RE_STORY = /^story:([a-z]+):([1-9]\d{0,3}(?::[1-9]\d{0,3}){1,2})$/;

  // Solve the hidden number of a gap sum; null when the key describes something impossible.
  function solveGap(op, A, B, c) {
    if ((A === '?') === (B === '?')) return null;
    const unk = A === '?' ? 'a' : 'b';
    const k = unk === 'a' ? Number(B) : Number(A);       // known operand
    let x;                                              // the hidden operand
    if (op === 'add') x = c - k;
    else if (op === 'sub') x = unk === 'a' ? c + k : k - c;
    else if (op === 'times') { if (c % k) return null; x = c / k; }
    else if (unk === 'a') x = c * k;                      // ? : k = c
    else { if (c === 0 || k % c) return null; x = k / c; } // k : ? = c
    if (!Number.isInteger(x) || x < 1 || x > MAXV) return null;
    const a = unk === 'a' ? x : k, b = unk === 'a' ? k : x;
    const ok = op === 'add' ? a + b === c : op === 'sub' ? a - b === c : op === 'times' ? a * b === c : b > 0 && a % b === 0 && a / b === c;
    return ok ? { a, b, unk } : null;
  }

  function descFromKey(key) {
    if (typeof key !== 'string' || key.length > 60) return null;
    let m;
    if ((m = RE_ADD.exec(key))) { const a = +m[1], b = +m[2]; return a + b <= MAXV ? descAdd(a, b) : null; }
    if ((m = RE_SUB.exec(key))) { const a = +m[1], b = +m[2]; return a >= b ? descSub(a, b) : null; }
    if ((m = RE_TIMES.exec(key))) { const a = +m[1], b = +m[2]; return a * b <= MAXV ? descTimes(a, b) : null; }
    if ((m = RE_DIV.exec(key))) { const n = +m[1], d = +m[2]; return n % d === 0 ? descDiv(n, d) : null; }
    if ((m = RE_GAP.exec(key))) {
      if (m[3] !== OPKEY[m[1]]) return null;
      const c = +m[5], s = solveGap(m[1], m[2], m[4], c);
      if (!s || c < 1) return null;
      return descGap(m[1], s.a, s.b, c, s.unk);
    }
    if ((m = RE_STORY.exec(key))) return storyDescFromKey(m[1], m[2].split(':').map(Number));
    return null;
  }

  function fromKey(key) {
    try {
      const d = descFromKey(key);
      return d ? d.make() : null;
    } catch (e) {
      return null;
    }
  }

  // ----------------------------------------------------------------- stories
  // A story = template (id + shape + text with {0} {1} {2}) and 2-3 numbers.
  // The shape says how the numbers combine; its `r` lists number ranges per
  // tier (0 = within 20 ... 5/6 = thousands). To add a story: append one line
  // to STORIES; to add a shape: add an entry to SHAPES.

  const S = MINUS;
  const LEAD = { '+': 'Samen of erbij: dat is optellen.', '\u2212': 'Er gaat iets weg: dat is aftrekken.', '\u00d7': 'Steeds evenveel: dat is een keersom.', ':': 'Verdelen in groepjes is delen.' };

  // `tab` is the index of the number that a table restriction applies to
  const SHAPES = {
    '+': {
      n: 2, tab: -1, calc: (n) => n[0] + n[1], fx: (n) => n[0] + '+' + n[1],
      r: [[[3, 12], [2, 8]], [[10, 60], [5, 39]], [[30, 80], [20, 70]], [[100, 600], [20, 380]], [[200, 900], [100, 700]], [[1000, 6000], [500, 3500]]],
      hints: () => ['Samenvoegen of erbij: dat is optellen.', 'Denk aan optellen: hoeveel is het samen?'],
      meth: (n, k) => choose(addMethods(n[0], n[1]), k, 'add'),
      explain: (n, r, k) => wrap(LEAD['+'] + ' ' + SHAPES['+'].meth(n, k).how, 'Dus ' + n[0] + ' + ' + n[1] + ' = ' + r + '.')
    },
    '\u2212': {
      n: 2, tab: -1, calc: (n) => (n[0] > n[1] ? n[0] - n[1] : -1), fx: (n) => n[0] + '-' + n[1],
      r: [[[8, 20], [2, 9]], [[20, 100], [5, 60]], [[50, 150], [15, 90]], [[200, 1000], [30, 600]], [[500, 2000], [100, 1200]], [[2000, 9999], [300, 5000]]],
      hints: () => ['Wat weggaat of overblijft: dat is aftrekken.', 'Denk aan aftrekken: hoeveel blijft er over?'],
      meth: (n, k) => choose(subMethods(n[0], n[1]), k, 'sub'),
      explain: (n, r, k) => wrap(LEAD['\u2212'] + ' ' + SHAPES['\u2212'].meth(n, k).how, 'Dus ' + n[0] + ' ' + S + ' ' + n[1] + ' = ' + r + '.')
    },
    '\u00d7': {
      n: 2, tab: 1, calc: (n) => (n[0] * n[1] <= MAXV ? n[0] * n[1] : -1), fx: (n) => n[0] + '*' + n[1],
      r: [[[2, 6], [2, 5]], [[2, 10], [2, 10]], [[5, 15], [2, 10]], [[11, 30], [2, 9]], [[12, 60], [3, 9]], [[101, 400], [2, 9]], [[11, 40], [11, 25]]],
      hints: () => ['Steeds evenveel erbij: dat is een keersom.', 'Maak er een keersom van: aantal groepjes keer wat erin zit.'],
      meth: (n, k) => choose(timesMethods(n[0], n[1]), k, 'times'),
      explain: (n, r, k) => wrap(LEAD['\u00d7'] + ' ' + SHAPES['\u00d7'].meth(n, k).how, 'Dus ' + n[0] + ' ' + TIMES + ' ' + n[1] + ' = ' + r + '.')
    },
    ':': {
      n: 2, tab: 1, calc: (n) => (n[0] % n[1] === 0 ? n[0] / n[1] : -1), fx: (n) => n[0] + '/' + n[1],
      draw: (rng, rs, tab) => { const d = tab ? RR.Rng.pick(rng, tab) : rint(rng, rs[0][0], rs[0][1]); return [d * rint(rng, rs[1][0], rs[1][1]), d]; },
      r: [[[2, 5], [2, 5]], [[2, 10], [2, 10]], [[2, 10], [6, 20]], [[2, 9], [12, 40]], [[2, 9], [20, 120]], [[2, 9], [40, 300]]],
      hints: () => ['Eerlijk verdelen of groepjes maken: dat is delen.', 'Denk aan delen: welke keersom hoort erbij?'],
      meth: (n, k) => choose(divMethods(n[0], n[1]), k, 'div'),
      explain: (n, r, k) => wrap(LEAD[':'] + ' ' + SHAPES[':'].meth(n, k).how, 'Dus ' + n[0] + ' : ' + n[1] + ' = ' + r + '.')
    },
    '\u00d7+': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => { const x = n[0] * n[1], r = x + n[2]; return r <= MAXV ? r : -1; }, fx: (n) => n[0] + '*' + n[1] + '+' + n[2],
      r: [[[2, 5], [2, 5], [2, 9]], [[2, 9], [2, 9], [3, 30]], [[3, 9], [3, 12], [5, 60]], [[5, 12], [6, 25], [10, 150]], [[10, 40], [6, 25], [50, 400]]],
      hints: () => ['Los het in twee stappen op: eerst keer, dan erbij.', 'Reken eerst uit hoeveel er in de groepjes zitten. Daarna komt er nog wat bij.'],
      explain: (n, r) => 'Eerst de groepjes: ' + n[0] + ' ' + TIMES + ' ' + n[1] + ' = ' + n[0] * n[1] + '.\nDan erbij: ' + n[0] * n[1] + ' + ' + n[2] + ' = ' + r + '.'
    },
    '\u00d7\u2212': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => (n[0] * n[1] > n[2] && n[0] * n[1] <= MAXV ? n[0] * n[1] - n[2] : -1), fx: (n) => n[0] + '*' + n[1] + '-' + n[2],
      r: [[[3, 6], [2, 6], [2, 9]], [[3, 9], [3, 9], [4, 25]], [[4, 12], [4, 12], [6, 60]], [[6, 15], [8, 25], [10, 200]], [[12, 40], [6, 25], [20, 400]]],
      hints: () => ['Los het in twee stappen op: eerst keer, dan eraf.', 'Reken eerst uit hoeveel er in totaal zijn. Daarna gaat er wat af.'],
      explain: (n, r) => 'Eerst: ' + n[0] + ' ' + TIMES + ' ' + n[1] + ' = ' + n[0] * n[1] + '.\nDaarna eraf: ' + n[0] * n[1] + ' ' + S + ' ' + n[2] + ' = ' + r + '.'
    },
    '+\u2212': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => (n[0] + n[1] > n[2] ? n[0] + n[1] - n[2] : -1), fx: (n) => n[0] + '+' + n[1] + '-' + n[2],
      r: [[[8, 15], [2, 8], [2, 9]], [[20, 60], [5, 40], [5, 50]], [[30, 90], [10, 60], [8, 70]], [[100, 500], [50, 400], [20, 300]], [[500, 3000], [200, 2000], [100, 1500]]],
      hints: () => ['Los het in twee stappen op: eerst erbij, dan eraf.', 'Tel eerst op wat erbij komt. Haal daarna weg wat eraf gaat.'],
      explain: (n, r) => 'Eerst erbij: ' + n[0] + ' + ' + n[1] + ' = ' + (n[0] + n[1]) + '.\nDaarna eraf: ' + (n[0] + n[1]) + ' ' + S + ' ' + n[2] + ' = ' + r + '.'
    },
    '++': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => { const r = n[0] + n[1] + n[2]; return r <= MAXV ? r : -1; }, fx: (n) => n[0] + '+' + n[1] + '+' + n[2],
      r: [[[2, 7], [2, 7], [2, 7]], [[10, 40], [5, 30], [5, 30]], [[20, 60], [15, 50], [10, 40]], [[100, 400], [50, 300], [20, 200]], [[500, 3000], [300, 2500], [100, 2000]]],
      hints: () => ['Los het in twee stappen op: tel eerst twee getallen op.', 'Tel de aantallen na elkaar op.'],
      explain: (n, r) => 'Eerst: ' + n[0] + ' + ' + n[1] + ' = ' + (n[0] + n[1]) + '.\nDan nog erbij: ' + (n[0] + n[1]) + ' + ' + n[2] + ' = ' + r + '.'
    },
    '\u2212\u2212': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => (n[0] - n[1] - n[2] >= 1 ? n[0] - n[1] - n[2] : -1), fx: (n) => n[0] + '-' + n[1] + '-' + n[2],
      r: [[[12, 20], [2, 6], [2, 6]], [[50, 100], [5, 30], [5, 30]], [[100, 200], [10, 60], [10, 60]], [[300, 1000], [50, 300], [20, 300]], [[1000, 5000], [200, 2000], [100, 1500]]],
      hints: () => ['Los het in twee stappen op: haal eerst het eerste weg.', 'Haal de aantallen na elkaar weg.'],
      explain: (n, r) => 'Eerst: ' + n[0] + ' ' + S + ' ' + n[1] + ' = ' + (n[0] - n[1]) + '.\nDan nog eraf: ' + (n[0] - n[1]) + ' ' + S + ' ' + n[2] + ' = ' + r + '.'
    },
    ':+': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => { if (n[0] % n[1]) return -1; const r = n[0] / n[1] + n[2]; return r <= MAXV ? r : -1; }, fx: (n) => n[0] + '/' + n[1] + '+' + n[2],
      draw: (rng, rs) => { const d = rint(rng, rs[0][0], rs[0][1]); return [d * rint(rng, rs[1][0], rs[1][1]), d, rint(rng, rs[2][0], rs[2][1])]; },
      r: [[[2, 5], [2, 5], [2, 9]], [[2, 10], [2, 10], [2, 20]], [[2, 9], [5, 20], [3, 30]], [[2, 9], [10, 60], [5, 90]], [[3, 9], [20, 150], [10, 200]]],
      hints: () => ['Los het in twee stappen op: eerst delen, dan erbij.', 'Verdeel eerst eerlijk. Daarna komt er voor ieder nog wat bij.'],
      explain: (n, r) => 'Eerst verdelen: ' + n[0] + ' : ' + n[1] + ' = ' + n[0] / n[1] + '.\nDan erbij: ' + n[0] / n[1] + ' + ' + n[2] + ' = ' + r + '.'
    },
    '\u00d7:': {
      n: 3, tab: -1, steps: 2,
      calc: (n) => { const x = n[0] * n[1]; return x <= MAXV && x % n[2] === 0 && n[2] !== n[0] && n[2] !== n[1] ? x / n[2] : -1; }, fx: (n) => '(' + n[0] + '*' + n[1] + ')/' + n[2],
      r: [[[2, 10], [2, 10], [2, 6]], [[3, 12], [3, 12], [2, 9]], [[5, 20], [5, 20], [2, 9]], [[10, 40], [5, 25], [2, 12]]],
      hints: () => ['Los het in twee stappen op: eerst keer, dan delen.', 'Reken eerst uit hoeveel er in totaal zijn. Verdeel ze daarna eerlijk.'],
      explain: (n, r) => 'Eerst samen: ' + n[0] + ' ' + TIMES + ' ' + n[1] + ' = ' + n[0] * n[1] + '.\nDan verdelen: ' + n[0] * n[1] + ' : ' + n[2] + ' = ' + r + '.'
    }
  };

  // cap: the biggest number that still sounds believable (a number, or one per
  // slot of the story); lo: first tier the template may appear in
  const STORIES = [
    { id: 'tulpen', cap: 250, sh: '+', t: 'Eef plukt {0} rode en {1} gele tulpen.\nHoeveel tulpen zijn dat samen?' },
    { id: 'schelpen', cap: 400, sh: '+', t: 'Sien vindt {0} schelpen op het strand. Bram vindt er {1}.\nHoeveel schelpen hebben ze samen?' },
    { id: 'fietsen', cap: 300, sh: '+', t: 'Voor de molen staan {0} fietsen. Er komen nog {1} fietsen bij.\nHoeveel fietsen staan er nu?' },

  const STORY_BY_ID = Object.create(null);
  STORIES.forEach((t) => { STORY_BY_ID[t.id] = t; });

  function descStory(tpl, n) {
    const sh = SHAPES[tpl.sh], r = sh.calc(n), key = 'story:' + tpl.id + ':' + n.join(':');
    let d = 2 + (sh.steps ? 1.5 : 0);
    n.forEach((v) => { d += 0.4 * Math.log2(1 + v); });
    return {
      key, kind: 'story', ans: r, d, tpl: tpl.id,
      make: () => {
        // one-step stories hint at the same method the explanation shows
        const base = sh.hints(), mine = base[hash(key + '|shape') % base.length];
        const m = sh.meth ? sh.meth(n, key) : null;
        const list = !m ? [mine] : hash(key + '|order') % 2 ? [mine, m.hint, m.alt, m.plain] : [m.hint, m.alt, mine, m.plain];
        return mk(key, 'story', tpl.t.replace(/\{(\d)\}/g, (x, i) => n[i]), r,
          firstSafe(list.concat(base), r, FB.story), sh.explain(n, r, key), sh.fx(n));
      }
    };
  }

  function storyDescFromKey(id, nums) {
    const tpl = STORY_BY_ID[id];
    if (!tpl) return null;
    const sh = SHAPES[tpl.sh];
    if (nums.length !== sh.n || nums.some((v) => !(v >= 2 && v <= MAXV))) return null;
    const r = sh.calc(nums);
    return r >= 1 && r <= MAXV ? descStory(tpl, nums) : null;
  }

  // Templates that can carry the numbers of a shape/tier (their `cap` is the
  // biggest number that still sounds believable), with the ranges clipped to it.
  const USABLE = {};
  const capAt = (cap, i) => (Array.isArray(cap) ? cap[Math.min(i, cap.length - 1)] : cap || MAXV);
  function usableTemplates(shape, tier) {
    const ck = shape + '|' + tier;
    if (USABLE[ck]) return USABLE[ck];
    const sh = SHAPES[shape], rs0 = sh.r[Math.min(tier, sh.r.length - 1)], out = [];
    STORIES.forEach((tpl) => {
      if (tpl.sh !== shape || (tpl.lo && tier < tpl.lo)) return;
      const rs = rs0.map((r, i) => { const cap = capAt(tpl.cap, i); return r[0] <= cap ? [r[0], Math.min(r[1], cap)] : null; });
      if (rs.every(Boolean)) out.push({ tpl, rs });
    });
    // a tier no template can carry falls back to the unclipped ranges
    return (USABLE[ck] = out.length ? out : STORIES.filter((t) => t.sh === shape).map((tpl) => ({ tpl, rs: rs0 })));
  }

  // Draw numbers; `tab` (list of numbers >= 2) pins the table slot of the shape.
  function drawStory(rng, shape, rs, tab, cap) {
    for (let t = 0; t < 60; t++) {
      const n = shape.draw ? shape.draw(rng, rs, tab) : rs.map((r, i) => (tab && i === shape.tab ? RR.Rng.pick(rng, tab) : rint(rng, r[0], r[1])));
      const v = shape.calc(n);
      if (v >= 1 && v <= MAXV && n.every((x, i) => x <= capAt(cap, i))) return n;
    }
    return null;
  }

  // spec = { sh: [shapes], tier, tab? }; usedTpl discourages repeats inside a series
  function sampleStory(rng, spec, tab, usedTpl) {
    for (let t = 0; t < 12; t++) {
      const shape = RR.Rng.pick(rng, spec.sh);
      const e = RR.Rng.pick(rng, usableTemplates(shape, spec.tier));
      if (usedTpl && usedTpl.has(e.tpl.id) && t < 8) continue;
      const n = drawStory(rng, SHAPES[shape], e.rs, SHAPES[shape].tab >= 0 ? tab : null, e.tpl.cap);
      if (n) return descStory(e.tpl, n);
    }
    return null;
  }

  // 'name:weight name' -> [{ spec, w }]
  function bank(table, text) {
    return text.split(' ').map((tok) => {
      const p = tok.split(':'), spec = table[p[0]];
      if (!spec) throw new Error('unknown bank entry ' + tok);
      return { spec, w: p.length > 1 ? Number(p[1]) : 1 };
    });
  }
  // 'add:4 sub:3' -> { add: 4, sub: 3 }
  function weights(text) {
    const out = {};
    text.split(' ').forEach((tok) => { const p = tok.split(':'); out[p[0]] = Number(p[1]); });
    return out;
  }

      add: bank(AD, add), sub: bank(SB, sub), times: bank(TM, times), div: bank(DV, div), story: bank(ST, story)

      const row = rows[y];

    } catch (e) { /* never break the game loop */ }

    } catch (e) { /* never break the game loop */ }

      k.chassis.forEach(function (l, i) { checkLayer(id + '.chassis[' + i + ']', l); });

      if (rows.length !== h) bad.push(label + ' has ' + rows.length + ' rows, expected ' + h);
      rows.forEach(function (r, i) {
        if (r.length !== w) bad.push(label + ' row ' + i + ' has width ' + r.length + ', expected ' + w);
        r.split('').forEach(function (ch) {
          if (ch !== '.' && !GLYPHS[ch]) bad.push(label + ' row ' + i + ' unknown glyph ' + ch);
